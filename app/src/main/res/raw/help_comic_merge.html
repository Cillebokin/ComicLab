<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: light dark;
            --text: #111827;
            --muted: #4B5563;
            --accent: #2563EB;
            --surface: transparent;
            --soft: #EFF6FF;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #F1F5F9;
                --muted: #CBD5E1;
                --accent: #60A5FA;
                --surface: transparent;
                --soft: #1E3A5F;
            }
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--surface);
        }

        body {
            color: var(--text);
            font-family: sans-serif;
            font-size: 16px;
            line-height: 1.7;
            padding: 20px 18px 28px;
        }

        h1 {
            color: var(--text);
            font-size: 24px;
            margin: 0 0 16px;
        }

        h2 {
            color: var(--accent);
            font-size: 18px;
            margin: 24px 0 8px;
        }

        p,
        ol {
            color: var(--muted);
        }

        p {
            margin: 8px 0;
        }

        ol {
            padding-left: 24px;
        }

        code {
            background: var(--soft);
            border-radius: 4px;
            color: var(--accent);
            padding: 2px 5px;
        }
    </style>
</head>
<body>
    <h1>漫画整合</h1>
    <p>把多个漫画压缩包里的图片取出来，放进一个新文件夹，方便放在一起浏览。原压缩包会保留。</p>

    <h2>怎么使用</h2>
    <ol>
        <li>打开存放漫画压缩包的文件夹</li>
        <li>点击菜单里的“漫画整合”</li>
        <li>图片会放进当前文件夹中新建的 <code>ComicLab_merged_...</code> 文件夹，并重新编号，例如 <code>0001.jpg</code></li>
    </ol>
    <p>只处理当前文件夹里的漫画压缩包，不会查找子文件夹里的压缩包。</p>
    <p>整合的是压缩包里的图片，不会生成一个新的漫画压缩包。</p>
</body>
</html>
