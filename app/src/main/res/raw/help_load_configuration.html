<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: light dark;
            --text: #111827;
            --muted: #4B5563;
            --accent: #2563EB;
            --surface: transparent;
            --soft: #EFF6FF;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #F1F5F9;
                --muted: #CBD5E1;
                --accent: #60A5FA;
                --surface: transparent;
                --soft: #1E3A5F;
            }
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--surface);
        }

        body {
            color: var(--text);
            font-family: sans-serif;
            font-size: 16px;
            line-height: 1.7;
            padding: 20px 18px 28px;
        }

        h1 {
            color: var(--text);
            font-size: 24px;
            margin: 0 0 16px;
        }

        h2 {
            color: var(--accent);
            font-size: 18px;
            margin: 24px 0 8px;
        }

        p,
        ol {
            color: var(--muted);
        }

        p {
            margin: 8px 0;
        }

        ol {
            padding-left: 24px;
        }

        code {
            background: var(--soft);
            border-radius: 4px;
            color: var(--accent);
            padding: 2px 5px;
        }
    </style>
</head>
<body>
    <h1>加载配置</h1>
    <p>选择之前导出的配置文件，将其中有效的记录和设置加载到软件中。</p>

    <h2>怎么加载</h2>
    <ol>
        <li>打开设置页，在下方找到 <code>配置管理</code></li>
        <li>点击 <code>加载配置</code>，选择配置文件</li>
    </ol>
    <p>原有有效记录会保留并与导入内容合并，导入的软件设置会应用到当前设备。</p>
    <p>如果漫画文件或文件夹无法访问，或漫画文件不受支持，对应记录会跳过，其他有效内容仍会恢复；完成后会显示恢复和跳过的数量。</p>
</body>
</html>
