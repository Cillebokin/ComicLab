<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root {
            color-scheme: light dark;
            --text: #111827;
            --muted: #4B5563;
            --accent: #2563EB;
            --surface: transparent;
            --soft: #EFF6FF;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --text: #F1F5F9;
                --muted: #CBD5E1;
                --accent: #60A5FA;
                --surface: transparent;
                --soft: #1E3A5F;
            }
        }

        html, body {
            margin: 0;
            padding: 0;
            background: var(--surface);
        }

        body {
            color: var(--text);
            font-family: sans-serif;
            font-size: 16px;
            line-height: 1.7;
            padding: 20px 18px 28px;
        }

        h1 {
            color: var(--text);
            font-size: 24px;
            margin: 0 0 16px;
        }

        h2 {
            color: var(--accent);
            font-size: 18px;
            margin: 24px 0 8px;
        }

        p,
        ol {
            color: var(--muted);
        }

        p {
            margin: 8px 0;
        }

        ol {
            padding-left: 24px;
        }

        code {
            background: var(--soft);
            border-radius: 4px;
            color: var(--accent);
            padding: 2px 5px;
        }
    </style>
</head>
<body>
    <h1>文件整合</h1>
    <p>把当前文件夹下各个子文件夹里的图片收集到一个新文件夹里。原图片会保留。</p>

    <h2>怎么使用</h2>
    <ol>
        <li>打开这些图片文件夹共同所在的文件夹</li>
        <li>点击菜单里的“文件整合”</li>
        <li>图片会复制到当前文件夹中新建的 <code>ComicLab_file_merged_...</code> 文件夹，并重新编号</li>
    </ol>
    <p>只处理下一级子文件夹里直接放着的图片，不会继续进入更深的文件夹。支持 JPG、JPEG、PNG、WEBP、GIF 和 BMP 图片。</p>

    <h2>示例</h2>
    <p><code>文件夹A/1.jpg</code> 和 <code>文件夹B/1.png</code><br>会放进新文件夹，并改成 <code>0001.jpg</code>、<code>0002.png</code></p>
</body>
</html>
