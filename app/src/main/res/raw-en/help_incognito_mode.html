<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root { color-scheme: light dark; --text: #111827; --muted: #4B5563; --accent: #2563EB; --surface: transparent; --soft: #EFF6FF; }
        @media (prefers-color-scheme: dark) {
            :root { --text: #F1F5F9; --muted: #CBD5E1; --accent: #60A5FA; --surface: transparent; --soft: #1E3A5F; }
        }
        html, body { margin: 0; padding: 0; background: var(--surface); }
        body { color: var(--text); font-family: sans-serif; font-size: 16px; line-height: 1.7; padding: 20px 18px 28px; }
        h1 { color: var(--text); font-size: 24px; margin: 0 0 16px; }
        h2 { color: var(--accent); font-size: 18px; margin: 24px 0 8px; }
        p, ol, ul { color: var(--muted); }
        p { margin: 8px 0; }
        ol, ul { padding-left: 24px; }
        code { background: var(--soft); border-radius: 4px; color: var(--accent); padding: 2px 5px; }
    </style>
</head>
<body>
    <h1>Incognito Mode</h1>
    <p>When enabled, reading will not record history or change reading progress.</p>

    <h2>How to use</h2>
    <ul>
        <li>Tap the <code>Incognito mode</code> icon in the top bar to toggle (blue circle = on)</li>
        <li>Existing history and progress stay untouched, and the state persists after restart</li>
    </ul>
</body>
</html>
